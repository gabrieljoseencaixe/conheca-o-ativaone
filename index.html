<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>AtivaOne</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: sidebar preta fixa, topo com busca global, conteúdo em painéis brancos sobre fundo neutro quente. Marca: chip SIM com canto cortado. */
:root{
  --red:#C8102E; --red-ink:#A50D26; --red-soft:#FBEBED; --on-red:#fff;
  --ink:#141112; --ink-2:#3a3436; --muted:#6c6467;
  --canvas:#F6F4F1; --paper:#ffffff; --line:#E6E2DD; --line-2:#EFECE8;
  --green:#2B7A52; --green-soft:#E4F2EA;
  --amber:#9A6200; --amber-soft:#FBF0D9;
  --grey-soft:#ECE9E9;
  --side:#0D0B0C; --side-2:#1b1819; --side-line:#2a2527; --side-ink:#EDE8E8; --side-muted:#9a9194;
  --shadow:0 1px 2px rgba(20,17,18,.04),0 14px 34px -22px rgba(20,17,18,.22);
  --f-display:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:9px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --red:#F2434F; --red-ink:#ff6a74; --red-soft:#3a1519; --on-red:#1a0305;
  --ink:#F3EEEE; --ink-2:#d2cbcc; --muted:#a0969a;
  --canvas:#0E0C0D; --paper:#1A1718; --line:#322d2f; --line-2:#262224;
  --green:#5CC08C; --green-soft:#16291f; --amber:#E6B04C; --amber-soft:#2e2410; --grey-soft:#2a2527;
  --side:#050405; --side-2:#141112; --side-line:#262123;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --red:#F2434F; --red-ink:#ff6a74; --red-soft:#3a1519; --on-red:#1a0305;
  --ink:#F3EEEE; --ink-2:#d2cbcc; --muted:#a0969a;
  --canvas:#0E0C0D; --paper:#1A1718; --line:#322d2f; --line-2:#262224;
  --green:#5CC08C; --green-soft:#16291f; --amber:#E6B04C; --amber-soft:#2e2410; --grey-soft:#2a2527;
  --side:#050405; --side-2:#141112; --side-line:#262123;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font:400 14px/1.55 var(--f-body);;-webkit-font-smoothing:antialiased;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--red-ink)}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:4px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums;font-stretch:92%}
.muted{color:var(--muted)} .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- login ---------- */
.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.login-art{background:var(--red);color:#fff;position:relative;overflow:hidden;padding:48px clamp(28px,5vw,72px);display:flex;flex-direction:column;justify-content:space-between;gap:32px;min-height:100vh}
.login-art .brand{display:flex;align-items:center;gap:12px}
.login-art h1{font-size:clamp(34px,4.6vw,62px);line-height:.98;font-stretch:112%;font-weight:800;max-width:11ch;color:#fff}
.login-art p{max-width:38ch;margin:18px 0 0;font-size:16px;color:#fff;opacity:.92}
.sim{position:absolute;right:-70px;top:9%;width:min(360px,48%);transform:rotate(9deg)}
.login-art .facts{display:flex;gap:28px;flex-wrap:wrap;position:relative;z-index:1}
.login-art .facts b{display:block;font:800 30px/1 var(--f-display);font-stretch:90%}
.login-art .facts span{font-size:13px;opacity:.92}
.login-form{display:flex;align-items:center;justify-content:center;padding:40px max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px));background:var(--paper)}
.login-card{width:min(400px,100%);display:flex;flex-direction:column;gap:18px}
.login-card h2{font-size:26px;font-weight:800}
.login-card .sub{color:var(--muted);margin:-10px 0 4px}
.login-links{display:flex;gap:8px;flex-wrap:wrap}.login-links .btn{flex:1 1 auto}
.dbstatus{margin:0;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px}.dbstatus:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}.dbstatus.ok:before{background:var(--green)}.dbstatus.off:before{background:var(--red)}
.sync{font-size:12.5px;color:var(--muted);margin-left:auto}.sync.error{color:var(--red-ink);font-weight:600}.sync.saved:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px}
.cotag{margin-left:0!important}
.demo{border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px;font-size:13px;display:grid;gap:8px;background:var(--canvas)}
.demo b{font-weight:600}
.demo .chips{display:flex;flex-wrap:wrap;gap:6px}
.chip-btn{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:4px 11px;font-size:12.5px;cursor:pointer}
.chip-btn:hover{border-color:var(--ink)}
.lockmsg{background:var(--red-soft);color:var(--red-ink);padding:10px 12px;border-radius:var(--r);font-size:13.5px}

/* ---------- campos ---------- */
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-weight:600;font-size:13px}
.fld .req{color:var(--red);font-style:normal;margin-left:3px}
input[type=text],input[type=password],input[type=search],input[type=tel],input[type=number],input[type=date],input[type=email],select,textarea{width:100%;min-height:40px;border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:8px 11px;transition:border-color .12s}
input[type=color]{width:56px;height:40px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);padding:3px}
textarea{min-height:76px;resize:vertical}
input:hover,select:hover,textarea:hover{border-color:var(--muted)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--red);outline-offset:-1px;border-color:var(--red)}
input[disabled],select[disabled]{background:var(--canvas);color:var(--muted)}
.fld.bad input,.fld.bad select,.fld.bad textarea{border-color:var(--red)}
.err{color:var(--red-ink);font-size:12.5px;min-height:0}
.hint{color:var(--muted);font-size:12.5px}
.check{display:flex;align-items:center;gap:8px;font-weight:500}
.check input{width:18px;height:18px;accent-color:var(--red)}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--paper);font-weight:600;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn.primary:hover{background:var(--red-ink);border-color:var(--red-ink)}
.btn.dark{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--line-2)}
.btn.danger{color:var(--red-ink);border-color:var(--red)}
.btn.sm{min-height:32px;padding:0 11px;font-size:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon-btn{width:40px;height:40px;display:inline-grid;place-items:center;border:1px solid transparent;background:transparent;border-radius:var(--r);cursor:pointer}
.icon-btn:hover{background:var(--line-2)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:20px 14px;gap:22px;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand .wm{font:800 19px/1 var(--f-display);font-stretch:118%;letter-spacing:.01em;color:#fff}
.brand .wm i{font-style:normal;color:var(--red)}
.login-art .brand .wm{font-size:22px} .login-art .brand .wm i{color:#fff;opacity:.78}
.nav{display:flex;flex-direction:column;gap:2px;overflow:auto}
.nav .grp{font-size:12px;color:var(--side-muted);padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r);color:var(--side-ink);text-decoration:none;font-weight:500;position:relative}
.nav a:hover{background:var(--side-2)}
.nav a[aria-current=page]{background:var(--red);color:#fff}
.nav a .badge{margin-left:auto;background:var(--red);color:#fff;border-radius:99px;font-size:11.5px;padding:1px 7px;font-weight:700}
.nav a[aria-current=page] .badge{background:#fff;color:var(--red-ink)}
.side .who{margin-top:auto;border-top:1px solid var(--side-line);padding:14px 6px 0;display:flex;gap:10px;align-items:center}
.side .who .av{width:34px;height:34px;border-radius:50%;background:var(--side-2);display:grid;place-items:center;font:700 13px var(--f-display);border:1px solid var(--side-line)}
.side .who small{display:block;color:var(--side-muted);font-size:12px;line-height:1.2}
.side .who strong{font-size:13.5px;font-weight:600;line-height:1.2}
.side .who .icon-btn{margin-left:auto;color:var(--side-ink)} .side .who .icon-btn:hover{background:var(--side-2)}
.main-col{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px clamp(16px,2.4vw,32px)}
.top .menu{display:none}
.gsearch{position:relative;flex:1;max-width:560px}
.gsearch input{padding-left:40px;background:var(--canvas);border-color:transparent;min-height:42px}
.gsearch input:focus{background:var(--paper)}
.gsearch>svg{position:absolute;left:12px;top:12px;color:var(--muted)}
.gsearch kbd{position:absolute;right:10px;top:10px;font:600 12px var(--f-body);border:1px solid var(--line);border-radius:4px;padding:1px 7px;color:var(--muted);background:var(--paper)}
.results{position:absolute;left:0;right:0;top:48px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 18px 40px -12px rgba(0,0,0,.35);max-height:70vh;overflow:auto;z-index:40}
.results h4{font-size:12.5px;color:var(--muted);padding:10px 14px 4px;font-weight:600}
.results button{display:flex;width:100%;text-align:left;gap:10px;align-items:center;justify-content:space-between;border:0;background:none;padding:9px 14px;cursor:pointer}
.results button:hover,.results button:focus-visible{background:var(--canvas)}
.results .empty{padding:18px 14px;color:var(--muted)}
.cotag{margin-left:auto;display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;border:1px solid var(--line);border-radius:99px;padding:5px 12px;white-space:nowrap}
.cotag:before{content:"";width:8px;height:8px;background:var(--green);border-radius:50%}
.content{padding:clamp(18px,2.4vw,32px);padding-left:max(clamp(16px,2.4vw,32px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,2.4vw,32px),env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px;max-width:1480px;width:100%}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-h h1{font-size:clamp(26px,3vw,36px);font-weight:800;font-stretch:104%}
.page-h p{margin:4px 0 0;color:var(--muted)}
.page-h .acts{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- painéis ---------- */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.panel>header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 0}
.panel>header h3{font-size:16px;font-weight:700}
.panel .body{padding:16px 18px 18px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{display:flex;flex-direction:column;gap:6px;text-align:left;padding:16px 16px 14px;border:1px solid var(--line);background:var(--paper);border-radius:10px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.kpi:hover{border-color:var(--ink);transform:translateY(-2px)}
.kpi .l{font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:7px}
.kpi .v{font:800 40px/1 var(--f-display);font-stretch:88%;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi.total{background:var(--side);border-color:var(--side);color:#fff} .kpi.total .l,.kpi.total .s{color:#bdb4b7}
.kpi.red .v{color:var(--red)}
.kpi.green .l:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--green)}
.kpi.red .l:before{content:"";width:9px;height:9px;background:var(--red);transform:rotate(45deg)}
.dash-cols{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:16px;align-items:start}
.stackcol{display:flex;flex-direction:column;gap:16px;min-width:0}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid2{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filters .fld{min-width:150px;flex:1 1 150px}
.filters .fld.grow{flex:2 1 260px}
.filters select,.filters input{min-height:38px}
.linemap{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px}
.cell{aspect-ratio:1;border-radius:4px;border:1.5px solid var(--ink);background:var(--paper);cursor:pointer;padding:0;position:relative}
.cell.aloc{background:var(--green);border-color:var(--green)}
.cell.bloq{background:var(--red);border-color:var(--red)}
.cell.canc{background:var(--grey-soft);border:1.5px dashed var(--muted)}
.cell.canc:after{content:"";position:absolute;left:3px;right:3px;top:50%;height:1.5px;background:var(--muted);transform:rotate(-35deg)}
.cell.reg{background:repeating-linear-gradient(45deg,var(--amber-soft),var(--amber-soft) 3px,var(--paper) 3px,var(--paper) 6px);border-color:var(--amber)}
.cell:hover{transform:scale(1.18);z-index:2}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:14px}
.legend button{display:flex;align-items:center;gap:7px;background:none;border:0;padding:2px 0;cursor:pointer;color:var(--ink-2)}
.legend .cell{width:14px;height:14px;aspect-ratio:auto;cursor:inherit}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(118px,1.3fr) minmax(0,1.2fr) 34px;gap:10px;align-items:center;border:0;background:none;padding:4px 0;text-align:left;cursor:pointer;border-radius:4px}
.bar-row:hover{background:var(--canvas)}
.bar-row .t{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.bar-row .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .tr{height:12px;background:var(--line-2);border-radius:3px;overflow:hidden}
.bar-row .tr i{display:block;height:100%;border-radius:3px}
.bar-row .n{text-align:right;font-weight:700}
.dot{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.stack{display:flex;height:16px;border-radius:4px;overflow:hidden;gap:2px;margin-bottom:14px}
.stack i{display:block;height:100%}
.plist{display:flex;flex-direction:column}
.pitem{display:flex;gap:12px;align-items:flex-start;text-align:left;border:0;border-top:1px solid var(--line-2);background:none;padding:11px 0;cursor:pointer;width:100%}
.pitem:first-child{border-top:0}
.pitem:hover{background:var(--canvas)}
.pitem .ic{color:var(--red);margin-top:2px}
.pitem small{display:block;color:var(--muted)}
.okbox{display:flex;gap:12px;align-items:center;color:var(--green);font-weight:600;padding:14px;background:var(--green-soft);border-radius:var(--r)}

/* ---------- tabelas ---------- */
.tablewrap{overflow:auto;max-height:calc(100vh - 330px);min-height:140px;border-top:1px solid var(--line)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
th{position:sticky;top:0;z-index:2;background:var(--paper);text-align:left;font-weight:700;font-size:12.5px;color:var(--muted);padding:11px 14px;border-bottom:1px solid var(--ink);white-space:nowrap}
td{white-space:nowrap;padding:11px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--canvas)}
tbody tr.dim td{opacity:.62}
td .main{font-weight:600} td.wrap,td.wrap .main{white-space:normal} td small{display:block;color:var(--muted);font-size:12.5px}
td.r,th.r{text-align:right}
.rowacts{display:flex;gap:6px;justify-content:flex-end}
.tfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;flex-wrap:wrap}
.emptystate{padding:46px 20px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.emptystate b{color:var(--ink);font-family:var(--f-display);font-size:18px}

/* ---------- etiquetas ---------- */
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:2px 9px 2px 7px;border-radius:99px;border:1px solid var(--line);background:var(--paper);white-space:nowrap;line-height:1.5}
.tag .dot{width:8px;height:8px}
.st-Disponível{border-color:var(--ink);color:var(--ink)}
.st-Disponível:before{content:"";width:8px;height:8px;border:1.8px solid currentColor;border-radius:50%}
.st-Alocada{background:var(--green-soft);border-color:transparent;color:var(--green)}
.st-Alocada:before{content:"";width:8px;height:8px;background:currentColor;border-radius:50%}
.st-Bloqueada{background:var(--red-soft);border-color:transparent;color:var(--red-ink)}
.st-Bloqueada:before{content:"";width:8px;height:8px;background:currentColor;transform:rotate(45deg)}
.st-Cancelada{background:var(--grey-soft);border-color:transparent;color:var(--muted);text-decoration:line-through}
.st-Cancelada:before{content:"×";text-decoration:none;font-weight:800;display:inline-block}
.st-regul{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
.st-regul:before{content:"";width:0;height:0;border:4.5px solid transparent;border-bottom:8px solid currentColor;border-top:0}
.al-no{border-style:dashed;border-color:var(--muted);color:var(--muted)}
.al-yes{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.es-ok{background:var(--green-soft);color:var(--green);border-color:transparent}
.es-warn{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.es-bad{background:var(--red-soft);color:var(--red-ink);border-color:transparent}
.es-off{background:var(--grey-soft);color:var(--muted);border-color:transparent}

/* ---------- modal, gaveta, toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,8,9,.58);display:flex;align-items:flex-start;justify-content:center;padding:0 16px;overflow:auto;z-index:100}
.modal{margin:5vh 0;background:var(--paper);border-radius:12px;width:min(620px,100%);box-shadow:0 30px 80px -20px rgba(0,0,0,.6);display:flex;flex-direction:column;border:1px solid var(--line)}
.modal.wide{width:min(860px,100%)}
.modal>header{padding:20px 24px 4px}
.modal>header h2{font-size:22px;font-weight:800}
.modal>header p{margin:4px 0 0;color:var(--muted)}
.modal .mbody{padding:14px 24px 6px;display:flex;flex-direction:column;gap:18px}
.modal>footer{display:flex;justify-content:flex-end;gap:8px;padding:16px 24px 20px;flex-wrap:wrap;position:sticky;bottom:0;background:var(--paper);border-radius:0 0 12px 12px;border-top:1px solid var(--line-2);margin-top:8px}
.fsec h4{font-size:15px;font-weight:700;padding-bottom:8px;border-bottom:1px solid var(--ink);margin-bottom:12px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.fsec h4 small{font:400 12.5px var(--f-body);color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fgrid .span2{grid-column:1/-1}

/* ---------- senha ---------- */
async function sha(txt){try{const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of txt)h=((h<<5)+h+c.charCodeAt(0))>>>0;return 'x'+h.toString(16)}}
const hashPw=(pw,salt)=>sha(salt+':'+pw);

function setSync(st,err){
  syncSt=st;const el=$('#sync');
  if(el){el.className='sync '+st;el.textContent=({idle:'',saving:'Salvando…',saved:'Salvo no banco',error:'Não salvo'})[st]||''}

function companyDoc(){const c=DB.companies.find(x=>x.id===S.co);return {...c,perms:DB.perms[S.co]}}
function snapshotAll(){
  SNAP.clear();COLLS.forEach(k=>DB[k].filter(o=>o.co===S.co).forEach(o=>SNAP.set(k+'/'+o.id,JSON.stringify(o))));
  SNAP.set('companies/'+S.co,JSON.stringify(companyDoc()));
}
async function doFlush(){
  if(MODE!=='db'||!DBH||!S.co)return;
  const ops=[],seen=new Set(),cd=companyDoc(),ck='companies/'+cd.id,cs=JSON.stringify(cd);
  if(SNAP.get(ck)!==cs)ops.push(['set',ck,cd,cs]);
  COLLS.forEach(k=>DB[k].forEach(o=>{if(o.co!==S.co)return;const key=k+'/'+o.id,j=JSON.stringify(o);seen.add(key);if(SNAP.get(key)!==j)ops.push(['set',key,o,j])}));
  SNAP.forEach((_,key)=>{if(!seen.has(key)&&key!==ck)ops.push(['del',key])});
  if(!ops.length)return;
  setSync('saving');
  try{
    for(const [t,key,obj,j] of ops){
      if(t==='set'){await DBH.doc(key).set(clone(obj));SNAP.set(key,j)}else{await DBH.doc(key).delete();SNAP.delete(key)}
    }
    setSync('saved');
  }catch(e){setSync('error',e)}
}
const flush=()=>{clearTimeout(flushT);flushT=null;chain=chain.then(doFlush);return chain};

async function loadCompany(coId){
  const cs=await DBH.doc('companies/'+coId).get();if(!cs.exists)throw new Error('empresa');
  const cd=clone(cs.data());const perms=cd.perms||DEFAULT_PERMS();delete cd.perms;
  const next={companies:[cd],perms:{[coId]:perms}};
  for(const k of COLLS){let q=DBH.collection(k).where('co','==',coId);if(k==='audit')q=q.orderBy('ts','desc');
    const r=await q.limit(k==='audit'?500:1000).get();next[k]=r.docs.map(d=>clone(d.data()))}
  return next;
}

let AFTER=null;
const guard=k=>{if(can(k))return true;toast('Seu perfil não permite esta ação.',true);return false};
const empOptions=(onlyActive,except)=>Emps().filter(e=>(!onlyActive||e.status==='Ativo')&&e.id!==except).sort((a,b)=>a.name.localeCompare(b.name,'pt-BR')).map(e=>[e.id,e.name+' · '+e.matricula]);
const grpOpts=sel=>Grps().filter(g=>g.active||g.id===sel).map(g=>[g.id,g.name]);
const catOpts=sel=>Cats().filter(c=>c.active||c.id===sel).map(c=>[c.id,c.name]);
const lineDevices=l=>Devs().filter(d=>d.lineId===l.id||(l.employeeId&&d.employeeId===l.employeeId&&d.estado!=='Baixado'));
const devLabel=d=>d.fabricante+' '+d.modelo;

function filterLines(){
  const f=F.lines,t=norm(f.q||''),d=digits(f.q||'');
  return Lns().filter(l=>{
    if(f.group&&l.groupId!==f.group)return false;
    if(f.cat==='__none'){if(l.catId)return false}else if(f.cat&&l.catId!==f.cat)return false;
    if(f.op&&l.operadora!==f.op)return false;if(f.status&&l.status!==f.status)return false;
    if(f.alloc==='Alocada'&&!l.employeeId)return false;if(f.alloc==='Não alocada'&&l.employeeId)return false;
    if(f.emp&&l.employeeId!==f.emp)return false;if(f.setor&&l.setor!==f.setor)return false;
    if(t){const e=empOf(l.employeeId),ds=lineDevices(l);
      const hay=[fmtPhone(l.number),l.number,l.iccid,e&&e.name,e&&e.matricula,l.plano,...ds.map(x=>devLabel(x)+' '+x.patrimonio)].map(norm).join(' ');
      if(!hay.includes(t)&&!(d.length>3&&(l.number.includes(d)||(l.iccid||'').includes(d))))return false}
    return true}).sort((a,b)=>a.number.localeCompare(b.number));
}
function linesList(){
  const all=filterLines(),rows=all.slice(0,LIMIT.lines);
  if(!Lns().length)return `<div class="emptystate"><b>Nenhuma linha cadastrada</b><span>Comece pelas categorias e pelos colaboradores, depois cadastre a primeira linha.</span><span>${can('linhas.criar')?'<button class="btn sm primary" data-act="new-line">Nova linha</button>':''}</span></div>`;
  if(!all.length)return `<div class="emptystate"><b>Nenhuma linha encontrada</b><span>Ajuste a busca ou limpe os filtros para ver todas as linhas.</span><span><button class="btn sm" data-act="clear-lines">Limpar filtros</button> ${can('linhas.criar')?'<button class="btn sm primary" data-act="new-line">Nova linha</button>':''}</span></div>`;
  return `<div class="tablewrap"><table><thead><tr><th>Número</th><th>Colaborador</th><th>Grupo e categoria</th><th>Situação</th><th>Alocação</th><th>Aparelho</th><th class="r">Custo mensal</th><th><span class="sr">Ações</span></th></tr></thead><tbody>
  ${rows.map(l=>{const e=empOf(l.employeeId),ds=lineDevices(l),mov=can('linhas.movimentar');
   const quick=mov&&l.status===ST.LIVRE?`<button class="btn sm primary" data-act="line-allocate" data-id="${l.id}">Alocar</button>`:mov&&l.employeeId&&l.status!==ST.CANC?`<button class="btn sm" data-act="line-return" data-id="${l.id}">Devolver</button>`:'';
   return `<tr data-act="open-line" data-id="${l.id}" class="${l.status===ST.CANC?'dim':''}" tabindex="0"><td><span class="main num" style="font-size:16px">${fmtPhone(l.number)}</span><small>${esc(l.operadora)} · ${l.iccid?'ICCID …'+esc(l.iccid.slice(-6)):'sem ICCID'}</small></td>
   <td>${e?`<span class="main">${esc(e.name)}</span><small>${esc(e.setor||'')}</small>`:'<span class="muted">—</span>'}</td><td><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-start">${grpTag(l.groupId)}${catTag(l.catId)}</div></td><td>${stTag(l.status)}</td><td>${alTag(l)}</td>
   <td>${ds[0]?`<span class="main">${esc(ds[0].modelo)}</span><small>${esc(ds[0].fabricante)}</small>`:'<span class="muted">—</span>'}</td><td class="r num">${money(l.cost)}</td><td class="r"><div class="rowacts">${quick}</div></td></tr>`}).join('')}
  </tbody></table></div><div class="tfoot"><span>Mostrando <b>${rows.length}</b> de <b>${all.length}</b> ${plural(all.length,'linha','linhas')}</span>${all.length>rows.length?'<button class="btn sm" data-act="more" data-ns="lines">Mostrar mais</button>':''}</div>`;
}

/* ---------- exportação ---------- */
function csvCell(v){const s=String(v??'');return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function exportModal(title,cols,rows,filterDesc){
  if(!guard('relatorios.exportar'))return;
  const meta=[['AtivaOne'],['Empresa',co().name],['Relatório',title],['Gerado em',fmtDT(Date.now())],['Gerado por',S.user.name],['Filtros',filterDesc||'Nenhum'],[]];
  const csv=[...meta,cols,...rows].map(r=>r.map(csvCell).join(';')).join('\n');
  audit('Exportou','Relatório',null,title+' ('+rows.length+' registros)');save();
  infoModal({title:'Exportar '+title.toLowerCase(),sub:`${rows.length} ${plural(rows.length,'registro','registros')} com os filtros aplicados. Copie e cole em Excel ou Google Planilhas (separador ponto e vírgula).`,wide:true,
    body:`<textarea class="csvbox" id="csvtxt" readonly aria-label="Conteúdo CSV">${esc(csv)}</textarea>`,
    footer:'<button class="btn" data-act="m-close">Fechar</button><button class="btn primary" data-act="copy-csv">'+ic('copy')+'Copiar tudo</button>'});
}
ACT['copy-csv']=async()=>{const t=$('#csvtxt');t.select();let ok=false;try{await navigator.clipboard.writeText(t.value);ok=true}catch(e){try{ok=document.execCommand('copy')}catch(_){}}toast(ok?'Conteúdo copiado.':'Copie com Ctrl+C: o texto já está selecionado.',!ok)};
const filterDescLines=()=>{const f=F.lines,p=[];if(f.q)p.push('busca "'+f.q+'"');if(f.group)p.push('grupo '+(grpOf(f.group)||{}).name);if(f.cat)p.push('categoria '+(f.cat==='__none'?'sem categoria':(catOf(f.cat)||{}).name));if(f.op)p.push('operadora '+f.op);if(f.status)p.push('situação '+f.status);if(f.alloc)p.push(f.alloc);if(f.emp)p.push('colaborador '+empName(f.emp));if(f.setor)p.push('setor '+f.setor);return p.join(', ')};
function lineRow(l){const e=empOf(l.employeeId),ds=lineDevices(l);return [fmtPhone(l.number),l.operadora,l.service,l.iccid,(grpOf(l.groupId)||{}).name||'',(catOf(l.catId)||{}).name||'',l.status,allocStatus(l),e?e.name:'',e?e.matricula:'',l.setor||'',l.plano||'',ds[0]?devLabel(ds[0]):'',l.cost!=null?String(l.cost).replace('.',','):'',fmtDate(l.activatedAt),fmtDate(l.allocatedAt),fmtDate(l.returnedAt),l.obs||'']}
const LINE_COLS=['Número','Operadora','Tipo de serviço','ICCID','Grupo','Categoria','Situação','Alocação','Colaborador','Matrícula','Setor','Plano','Aparelho','Custo mensal (R$)','Ativação','Alocada em','Devolvida em','Observações'];

function lineForm(id,v){
  const l=id?lineOf(id):null;if(id&&!l)return;if(!guard(l?'linhas.editar':'linhas.criar'))return;
  if(!l&&!Grps().some(g=>g.active)){toast('Crie ao menos um grupo antes de cadastrar linhas.',true);go('grupos');return}
  if(!l&&!Cats().some(c=>c.active)){toast('Cadastre ao menos uma categoria antes de criar linhas.',true);go('categorias');return}
  const free=Devs().filter(d=>d.estado!=='Baixado'&&(!d.lineId||(l&&d.lineId===l.id)));

   :{title:'Alocação',hint:'Datas são preenchidas automaticamente',fields:[{id:'status',label:'Situação inicial',type:'select',blank:false,req:true,options:[ST.LIVRE,ST.ALOC,ST.REG],hint:'Disponível aparece como não alocada.'},{id:'emp',label:'Colaborador',type:'select',req:true,options:empOptions(true),dep:['status',[ST.ALOC]],hint:'Obrigatório quando a linha está alocada.'}]};
  formModal({title:l?'Editar linha':'Nova linha',sub:l?fmtPhone(l.number):'Preencha o que já souber. Os campos com * são obrigatórios.',wide:true,values:v||base,submitLabel:l?'Salvar alterações':'Salvar linha',
   sections:[
    {title:'Dados da linha',fields:[

      {id:'operadora',label:'Operadora',type:'select',blank:false,req:true,options:co().operadoras},
      {id:'service',label:'Tipo de serviço',type:'select',blank:false,req:true,options:SERVICES},
      {id:'iccid',label:'ICCID / número do chip',ph:'89550… (19 ou 20 dígitos)',inputmode:'numeric',max:22,hint:'Recomendado. Não pode repetir em outra linha.'},
      {id:'group',label:'Grupo',type:'select',req:true,options:grpOpts(l&&l.groupId)},
      {id:'cat',label:'Categoria',type:'select',req:true,options:catOpts(l&&l.catId)},

      {id:'plano',label:'Plano contratado',ph:'Ex.: Empresarial 40 GB'},
      {id:'act',label:'Data de ativação',type:'date'}]},
    alocSection,
    {title:'Aparelho',hint:'Opcional',fields:[{id:'dev',label:'Aparelho usado com esta linha',type:'select',span:true,blankLabel:'Nenhum aparelho vinculado',options:free.map(d=>[d.id,devLabel(d)+' · '+d.patrimonio])}]},
    {title:'Custos',fields:[{id:'cost',label:'Custo mensal (R$)',type:'number',ph:'0,00',hint:'Mudanças ficam no histórico de custos.'},{id:'venc',label:'Dia de vencimento',type:'number',ph:'Ex.: 10'}]},
    {title:'Observações',fields:[{id:'obs',label:'Observações',type:'textarea',span:true},...(l?[]:[{id:'files',label:'Anexos (termo de responsabilidade, comprovantes)',type:'file',span:true,hint:'Neste protótipo só o nome do arquivo é guardado.'}])]}],
   validate:val=>{const e={};
     if(!validNumber(val.number))e.number='Informe o número com DDD, com 10 ou 11 dígitos.';
     else{const dup=dupNumber(val.number,l&&l.id);if(dup)e.number='Já existe uma linha ativa com este número: '+(dup.employeeId?'alocada a '+empName(dup.employeeId):'não alocada')+'.'}

     if(val.cost!==''&&(isNaN(+val.cost)||+val.cost<0))e.cost='Informe um valor em reais, sem texto.';

     const map={number:['Número',x=>fmtPhone(x)],operadora:['Operadora'],service:['Tipo de serviço'],iccid:['ICCID'],groupId:['Grupo',x=>(grpOf(x)||{}).name],catId:['Categoria',x=>(catOf(x)||{}).name],setor:['Setor'],plano:['Plano'],cost:['Custo mensal',x=>x==null?'—':money(x)],venc:['Vencimento'],obs:['Observações']};
     const after={...l,number:digits(val.number),operadora:val.operadora,service:val.service,iccid:val.iccid,groupId:val.group,catId:val.cat,setor:val.setor,plano:val.plano,cost,venc:val.venc,obs:val.obs};
     const ch=diffs(l,after,map);
     if((l.cost??null)!==cost&&cost!=null)l.costHistory.push({ts:now,value:cost,userId:S.user.id});
     Object.assign(l,{number:after.number,operadora:after.operadora,service:after.service,iccid:after.iccid,groupId:after.groupId,catId:after.catId,setor:after.setor,plano:after.plano,cost,venc:after.venc,obs:after.obs,activatedAt:parseDate(val.act),updatedAt:now,updatedBy:S.user.id});
     if((val.dev||'')!==(l.deviceId||'')){const ov=devOf(l.deviceId);ch.push({f:'Aparelho',from:ov?devLabel(ov):'—',to:val.dev?devLabel(devOf(val.dev)):'—'});if(ov)ov.lineId=null;l.deviceId=null;if(val.dev)linkDevice(l,val.dev)}
     if(ch.length)audit('Alterou','Linha',l.id,fmtPhone(l.number),ch);
     save();closeModal();toast(ch.length?'Alterações salvas.':'Nada mudou.');refresh()}});

function linkDevice(l,devId){const d=devOf(devId);if(!d)return;const old=lineOf(d.lineId);if(old&&old.id!==l.id)old.deviceId=null;d.lineId=l.id;l.deviceId=d.id;d.updatedAt=Date.now();d.updatedBy=S.user.id}

/* ---------- ficha da linha ---------- */
function lineHistory(l){
  const items=DB.moves.filter(m=>m.co===S.co&&m.entity==='line'&&m.entityId===l.id).map(m=>({ts:m.ts,type:m.type,m}));
  DB.audit.filter(a=>a.co===S.co&&a.entity==='Linha'&&a.entityId===l.id&&(a.action==='Criou'||a.action==='Alterou')).forEach(a=>items.push({ts:a.ts,type:a.action,a}));
  return items.sort((x,y)=>y.ts-x.ts);
}
function histItemHTML(it){
  if(it.m){const m=it.m,cls=/Bloqueio|Cancelamento/.test(m.type)?'bad':/Aloca|Entrega|Reativ/.test(m.type)?'ok':'';
    const who=m.type==='Transferência'?empName(m.fromEmpId)+' → '+empName(m.empId):m.type==='Devolução'||m.type==='Devolução de aparelho'?'de '+empName(m.fromEmpId):m.empId?empName(m.empId):'';
    return `<li class="${cls}"><div><b>${esc(m.type)}${who?' · '+esc(who):''}</b><small>${fmtDT(m.ts)} · por ${esc(whoName(m.userId))}</small>${m.motivo?`<small>Motivo: ${esc(m.motivo)}${m.cond?' · Condição: '+esc(m.cond):''}</small>`:''}${m.obs?`<small>${esc(m.obs)}</small>`:''}</div></li>`}
  const a=it.a;return `<li><div><b>${a.action==='Criou'?'Cadastro criado':'Cadastro alterado'}</b><small>${fmtDT(a.ts)} · por ${esc(a.userName)}</small>${(a.changes||[]).map(c=>`<small>${esc(c.f)}: ${esc(c.from)} → ${esc(c.to)}</small>`).join('')}</div></li>`}
function lineFicha(dr){
  const l=lineOf(dr.id);if(!l)return null;const e=empOf(l.employeeId),ds=lineDevices(l),mov=can('linhas.movimentar'),blk=can('linhas.bloquear'),tab=dr.tab||'resumo';
  const A=[];
  if(mov&&l.status===ST.LIVRE)A.push(`<button class="btn primary" data-act="line-allocate" data-id="${l.id}">Alocar</button>`);
  if(mov&&l.employeeId&&l.status!==ST.CANC)A.push(`<button class="btn" data-act="line-return" data-id="${l.id}">${ic('undo')}Devolver</button><button class="btn" data-act="line-transfer" data-id="${l.id}">${ic('swap')}Transferir</button>`);
  if(blk&&(l.status===ST.BLOQ||l.status===ST.REG))A.push(`<button class="btn" data-act="line-reactivate" data-id="${l.id}">Reativar</button>`);
  if(blk&&(l.status===ST.LIVRE||l.status===ST.ALOC))A.push(`<button class="btn" data-act="line-block" data-id="${l.id}">${ic('lock')}Bloquear</button><button class="btn" data-act="line-regul" data-id="${l.id}">Enviar p/ regularização</button>`);
  if(blk&&l.status!==ST.CANC)A.push(`<button class="btn danger" data-act="line-cancel" data-id="${l.id}">${ic('ban')}Cancelar linha</button>`);
  if(mov&&l.status!==ST.CANC)A.push(`<button class="btn" data-act="line-chip" data-id="${l.id}">${ic('chip')}Trocar chip</button>`);
  if(can('linhas.editar'))A.push(`<button class="btn" data-act="edit-line" data-id="${l.id}">${ic('edit')}Editar</button>`);
  let body=`<div class="actions">${A.join('')||'<span class="muted">Seu perfil só permite consulta.</span>'}</div>
   <div class="tabs" role="tablist">${[['resumo','Resumo'],['hist','Histórico'],['custos','Custos']].map(([k,t])=>`<button role="tab" aria-selected="${tab===k}" data-act="dr-tab" data-t="${k}">${t}</button>`).join('')}</div>`;
  if(tab==='resumo'){
    const pend=pendencias().filter(p=>p.id===l.id);
    body+=(pend.length?`<div class="note bad">${pend.map(p=>esc(p.t)).join('. ')}.</div>`:'')+
    `<dl class="dl"><dt>Colaborador</dt><dd>${e?`<a href="#" data-act="open-emp" data-id="${e.id}">${esc(e.name)}</a> ${empStTag(e.status)}`:'Não alocada'}</dd>
    <dt>Operadora</dt><dd>${esc(l.operadora)}</dd><dt>Tipo de serviço</dt><dd>${esc(l.service)}</dd><dt>ICCID</dt><dd class="num">${esc(l.iccid||'—')}</dd>
    <dt>Setor</dt><dd>${esc(l.setor||'—')}</dd><dt>Plano</dt><dd>${esc(l.plano||'—')}</dd>
    <dt>Aparelho</dt><dd>${ds.length?ds.map(d=>`<a href="#" data-act="open-dev" data-id="${d.id}">${esc(devLabel(d))}</a>`).join(', '):'—'}</dd>
    <dt>Ativação</dt><dd>${fmtDate(l.activatedAt)}</dd><dt>Alocada em</dt><dd>${fmtDate(l.allocatedAt)}</dd><dt>Devolvida em</dt><dd>${fmtDate(l.returnedAt)}</dd>
    <dt>Custo mensal</dt><dd>${money(l.cost)}</dd><dt>Vencimento</dt><dd>${l.venc?'Dia '+esc(l.venc):'—'}</dd>
    <dt>Anexos</dt><dd>${(l.attach||[]).length?l.attach.map(a=>esc(a.name)).join(', '):'—'}</dd><dt>Observações</dt><dd>${esc(l.obs||'—')}</dd>
    <dt>Criada</dt><dd>${fmtDT(l.createdAt)} por ${esc(whoName(l.createdBy))}</dd><dt>Última alteração</dt><dd>${fmtDT(l.updatedAt)} por ${esc(whoName(l.updatedBy))}</dd></dl>`;
  }else if(tab==='hist'){const h=lineHistory(l);body+=h.length?`<ul class="timeline">${h.map(histItemHTML).join('')}</ul>`:'<div class="emptystate"><b>Sem movimentações</b><span>Alocações, devoluções e bloqueios aparecem aqui.</span></div>'}
  else{const ch=(l.costHistory||[]).slice().reverse();body+=ch.length?`<ul class="timeline">${ch.map(c=>`<li><div><b class="num">${money(c.value)}</b><small>${fmtDT(c.ts)} · por ${esc(whoName(c.userId))}</small></div></li>`).join('')}</ul>`:'<div class="emptystate"><b>Sem custo informado</b><span>Informe o custo mensal ao editar a linha.</span></div>'}
  return {title:`<span class="num">${fmtPhone(l.number)}</span>`,aria:'Ficha da linha '+fmtPhone(l.number),tags:stTag(l.status)+alTag(l)+grpTag(l.groupId)+catTag(l.catId),body};
}

function flow(o){
  formModal({title:o.title,sub:o.sub,values:o.v||{},intro:o.intro,danger:o.danger,submitLabel:'Continuar',
    sections:[{fields:o.fields}],validate:o.validate,
    onSubmit(val){confirmDialog({title:o.confirmTitle||o.title,rows:[...o.rows(val),NOW_ROW(),WHO_ROW()],label:o.label,danger:o.danger,note:o.note&&o.note(val),
      onBack:()=>o.reopen(val),onConfirm(){const a=AFTER;AFTER=null;o.apply(val);closeModal();toast(o.ok(val));refresh();if(a)a()}})}});
}
const LN=l=>['Linha',fmtPhone(l.number)+' · '+l.operadora];
function flowAllocate(id,v={}){
  const l=lineOf(id);if(!l||!guard('linhas.movimentar'))return;
  if(l.status!==ST.LIVRE){toast('Só linhas disponíveis podem ser alocadas.',true);return}
  if(!empOptions(true).length){toast('Cadastre um colaborador ativo antes de alocar.',true);return}
  flow({title:'Alocar linha',sub:fmtPhone(l.number)+' · '+l.operadora,v:{group:l.groupId,cat:l.catId,...v},
    fields:[{id:'emp',label:'Colaborador ativo',type:'select',req:true,span:true,options:empOptions(true)},{id:'group',label:'Grupo',type:'select',req:true,options:grpOpts(l.groupId)},{id:'cat',label:'Categoria',type:'select',req:true,options:catOpts(l.catId)},{id:'obs',label:'Observação',type:'textarea',span:true}],
    rows:val=>[LN(l),['Colaborador',empName(val.emp)],['Grupo',(grpOf(val.group)||{}).name],['Categoria',(catOf(val.cat)||{}).name],['Observação',val.obs]],
    note:val=>Lns().some(x=>x.id!==l.id&&x.employeeId===val.emp&&x.status!==ST.CANC)?'Este colaborador já tem outra linha alocada.':'',
    label:'Alocar linha',reopen:val=>flowAllocate(id,val),apply:val=>doAllocate(l,val.emp,{groupId:val.group,catId:val.cat,obs:val.obs}),ok:val=>'Linha alocada a '+empName(val.emp)+'.'});
}
function flowReturn(id,v={}){
  const l=lineOf(id);if(!l||!guard('linhas.movimentar'))return;if(!l.employeeId){toast('Esta linha não está alocada.',true);return}
  flow({title:'Devolver linha',sub:fmtPhone(l.number)+' · com '+empName(l.employeeId),v:{cond:'Apta para reutilização',destino:ST.LIVRE,...v},
    fields:[{id:'motivo',label:'Motivo da devolução',type:'select',req:true,options:['Fim de uso','Desligamento do colaborador','Troca de função','Substituição de aparelho','Outro']},
     {id:'cond',label:'Condição da linha e do chip',type:'select',blank:false,req:true,options:['Apta para reutilização','Chip com defeito','Chip perdido ou roubado','Linha com pendência na operadora']},
     {id:'destino',label:'A linha passa a ficar',type:'select',blank:false,req:true,span:true,options:[[ST.LIVRE,'Disponível (não alocada)'],[ST.BLOQ,'Bloqueada'],[ST.REG,'Em regularização']],hint:'Se não estiver apta para reutilização, bloqueie ou envie para regularização.'},
     {id:'obs',label:'Observação',type:'textarea',span:true}],
    validate:val=>val.destino===ST.LIVRE&&val.cond!=='Apta para reutilização'?{destino:'Uma linha que não está apta não pode voltar como disponível.'}:{},
    rows:val=>[LN(l),['Colaborador atual',empName(l.employeeId)],['Motivo',val.motivo],['Condição',val.cond],['Nova situação',val.destino],['Observação',val.obs]],
    label:'Registrar devolução',reopen:val=>flowReturn(id,val),apply:val=>doReturn(l,val),ok:()=>'Devolução registrada.'});
}
function flowTransfer(id,v={}){
  const l=lineOf(id);if(!l||!guard('linhas.movimentar'))return;if(!l.employeeId){toast('Esta linha não está alocada.',true);return}
  flow({title:'Transferir linha',sub:fmtPhone(l.number)+' · de '+empName(l.employeeId),v,
    fields:[{id:'to',label:'Novo colaborador ativo',type:'select',req:true,span:true,options:empOptions(true,l.employeeId)},{id:'motivo',label:'Motivo',type:'select',req:true,options:['Troca de função','Mudança de setor','Desligamento do colaborador','Outro']},{id:'obs',label:'Observação',type:'textarea',span:true}],
    rows:val=>[LN(l),['De',empName(l.employeeId)],['Para',empName(val.to)],['Motivo',val.motivo],['Observação',val.obs]],
    note:()=>'A alocação anterior será encerrada e uma nova será criada. O histórico não é apagado.',
    label:'Transferir linha',reopen:val=>flowTransfer(id,val),apply:val=>doTransfer(l,val.to,val),ok:val=>'Linha transferida para '+empName(val.to)+'.'});

function simpleStatusFlow(id,cfg,v={}){
  const l=lineOf(id);if(!l||!guard('linhas.bloquear'))return;

     if(!/^\S+@\S+\.\S+$/.test(val.email))e.email='Informe um e-mail válido.';else if(!u&&DB.users.some(x=>mailKey(x.email)===mailKey(val.email)))e.email='Este e-mail já tem cadastro.';

function parseCSV(txt){
  txt=String(txt||'').replace(/^﻿/,'');const first=txt.split(/\r?\n/)[0]||'';

  for(let i=0;i<txt.length;i++){const ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;
    else if(ch===d){row.push(cur);cur=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;row.push(cur);cur='';rows.push(row);row=[]}
    else cur+=ch}
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}

      async get(){const rows=await rpcS('ao_listar',{p_colecao:coll,p_limite:st.lim,p_desc:st.ord==='desc'});const docs=rows.map(d=>({id:d.id,exists:true,data:()=>d}));return {docs,size:docs.length}}};

setInterval(()=>{if(S.user&&Date.now()-S.last>co().timeout*60000)logout('Sua sessão foi encerrada por inatividade. Entre de novo para continuar.')},5000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pullFresh()});
setInterval(()=>{if(!document.hidden)pullFresh()},45000);
(async function init(){
  try{const t=localStorage.getItem(THEME_KEY);if(t)document.documentElement.dataset.theme=t}catch(e){}
  try{['linhaleads.proto.v3','linhaleads.theme','linhaleads.lastco','ativaone.demo.v1'].forEach(k=>localStorage.removeItem(k))}catch(e){}
  renderLogin();
  if(sbInit()){DBH=SBH;MODE='none'}
  else try{DBH=await Promise.race([window.claude&&window.claude.use?window.claude.use('db'):null,new Promise(r=>setTimeout(()=>r(null),6000))])}catch(e){DBH=null}
  const st=$('#dbstatus');if(st){st.className='dbstatus '+(DBH?'ok':'off');st.textContent=DBH?'Banco de dados conectado':'Banco de dados não conectado';
    }
  const sbx=$('#setupbox');if(sbx&&!DBH&&!window.claude)sbx.innerHTML='<div class="note warn"><b>Primeiro passo:</b> conecte o AtivaOne ao seu banco de dados (Supabase). É só uma vez.<br><button class="btn primary sm" type="button" data-act="sbsetup" style="margin-top:10px">Conectar ao Supabase</button></div>'
})();
</script>
